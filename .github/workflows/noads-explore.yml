name: noads-explore

# Manual (or on changes to the walk). Builds the no-ads APK, then walks the ORIGINAL and the PATCHED app through
# Home -> Categories -> Promotion -> Me -> open a movie -> playback on an emulator that can run
# ARM apps, and prints what is on screen plus crash / native-library / player evidence.
on:
  workflow_dispatch:
  push:                     # also runs when the walk itself changes (this is what registers the workflow)
    branches: [recovered-source]
    paths: ['noads/ci/explore.sh', 'noads/ci/uitool.py', '.github/workflows/noads-explore.yml']

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Put Android build-tools (apksigner) on PATH
        run: echo "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)" >> "$GITHUB_PATH"
      - run: bash noads/build.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash noads/ci/explore.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: explore-output
          path: explore-out/
          if-no-files-found: ignore
