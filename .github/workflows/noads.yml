name: noads-apk

# Builds the ad-free Flickverse APK from apk-original/ with the in-place patches in noads/,
# smoke-tests the ORIGINAL (control) and the PATCHED apk on an Android emulator, and (only when
# you run it by hand with publish=true) publishes a GitHub pre-release.
on:
  push:
    branches: [recovered-source]
    paths: ['noads/**', '.github/workflows/noads.yml']
    tags: ['noads-*']          # pushing a tag like noads-1 builds AND publishes a pre-release
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub pre-release with the APK'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Put Android build-tools (apksigner) on PATH
        run: echo "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)" >> "$GITHUB_PATH"
      - name: Use the ORIGINAL signing key if it is stored as repository secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/original.keystore"
            {
              echo "KS=$RUNNER_TEMP/original.keystore"; echo "KS_PASS=$KEYSTORE_PASSWORD"
              echo "KS_ALIAS=${KEY_ALIAS:-flickverse}"; echo "KS_KEY_PASS=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
              echo "EXPECT_CERT_MD5=099656628B5CF75B43B04EECE0E62FA4"
            } >> "$GITHUB_ENV"
            echo "Signing with the ORIGINAL keystore from repository secrets."
          else
            echo "No KEYSTORE_BASE64 secret: signing with the throw-away key (the native P2P engine will NOT start)."
          fi
      - name: Build, sign, check
        run: bash noads/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: flickverse-noads-apk
          path: build/Flickverse-V4.0.0-noads.apk
          if-no-files-found: error

  smoke:
    needs: build
    name: smoke (api ${{ matrix.api }} ${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The app ships ARM-only native libraries, so the emulator image must include ARM translation.
        # Which images do is not documented reliably, so try a few; the control run says which work.
        include:
          - { api: 30, target: google_apis }
          - { api: 30, target: google_apis_playstore }
          - { api: 33, target: google_apis_playstore }
          - { api: 34, target: google_apis_playstore }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: flickverse-noads-apk, path: build }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          disable-animations: true
          script: bash noads/ci/smoke-all.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-output-${{ matrix.api }}-${{ matrix.target }}
          path: smoke-out/
          if-no-files-found: ignore

  release:
    # Needs only a successful BUILD. The emulator result is reported in the notes but does not block,
    # because this app is ARM-only and not every emulator image can run it.
    if: ${{ always() && needs.build.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.publish) || startsWith(github.ref, 'refs/tags/noads-')) }}
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: flickverse-noads-apk, path: build }
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE: ${{ needs.smoke.result }}
        run: |
          case "$GITHUB_REF" in refs/tags/*) tag="$GITHUB_REF_NAME" ;; *) tag="v4.0.0-noads-${GITHUB_RUN_NUMBER}" ;; esac
          sha=$(sha256sum build/Flickverse-V4.0.0-noads.apk | cut -d' ' -f1)
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat > notes.md <<NOTES
          Flickverse V4.0.0 with the ad SDKs switched off (see noads/README.md for exactly what is patched).

          **Install:** uninstall the original app first (this build has a different signature, so Android refuses to update over it), then install this APK.
          Personal-use build, signed with the throw-away key in noads/signing/.

          **Known limitation:** unless it was signed with the original app key, the app's native P2P engine does not start (verified on an emulator), so P2P-hosted videos and in-app downloads may not work. Ordinary streams are expected to play. See noads/README.md.

          **Status:** structure/signature/alignment checks pass. Emulator smoke test result: \`${SMOKE}\` (details: ${run_url}). Not yet confirmed on a physical phone.

          SHA-256: \`${sha}\`
          NOTES
          sed -i 's/^          //' notes.md
          gh release create "$tag" build/Flickverse-V4.0.0-noads.apk --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Flickverse V4.0.0 (no ads) - $tag" --notes-file notes.md
          echo "RELEASE: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag"
