name: noads-p2p

# Runs when its own files change (or manually): is the native P2P engine healthy in the patched build?
on:
  workflow_dispatch:
  push:
    branches: [recovered-source]
    paths: ['noads/ci/p2p-check.sh', '.github/workflows/noads-p2p.yml']

permissions:
  contents: read

jobs:
  p2p:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Put Android build-tools (apksigner) on PATH
        run: echo "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)" >> "$GITHUB_PATH"
      - name: Build the patched APK and a re-signed-only copy (original code, new signature)
        run: |
          bash noads/build.sh
          NO_PATCH=1 WORK=build/work-resign OUT=build/resigned-only.apk bash noads/build.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash noads/ci/p2p-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2p-output
          path: p2p-out/
          if-no-files-found: ignore
